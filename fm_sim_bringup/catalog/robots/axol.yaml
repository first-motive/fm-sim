# Catalog entry (fm_sim.robots): the bimanual Almond Bot Axol on its Ox cart, in
# fm-robot's axol names. As on the OpenArm, each arm's forward position controller
# commands its seven joints and then the finger, so there is no gripper controller:
# the finger moves only while the forward controller is active. No robot profile
# describes it yet, so a controller with a launch of its own is refused on it; idle
# and teleop run.
name: axol
description: Almond Bot Axol on the Ox cart, two 7-DOF arms with grippers (fm-robot axol names)
available: true
description_file:
  package: fm_control
  path: urdf/axol.sim.urdf.xacro
description_args: {}
# fm_sim_models compiles the MJCF from fm_description's axol_ox_cart.urdf. Its origin
# is the description's root (world), so it mounts at the default [0, 0, 0].
mjcf: axol
# The vendored URDF names its meshes relative to its own file; the generators write
# the expanded description elsewhere, so they resolve them here.
mesh_roots:
  - {prefix: meshes/, package: fm_description, path: axol_description/meshes}
controllers_file:
  package: fm_sim_bringup
  path: config/axol/axol.controllers.yaml
controller_roles:
  broadcasters: [joint_state_broadcaster]
  arm_trajectory: [axol_left_jtc, axol_right_jtc]
  arm_forward_position:
    [axol_left_forward_position_controller, axol_right_forward_position_controller]
robot_profile: null
supported_backends: [mujoco, gazebo, isaac]
# Run tunables (fm_sim_bringup.params).
params:
  update_rate:
    label: Control rate
    description: The controller_manager's update rate.
    type: int
    default: 100
    min: 25
    max: 500
    step: 25
    unit: Hz
    advanced: true
    backends:
    - mujoco
    target:
      kind: ros_param
      node: /controller_manager
      param: update_rate
