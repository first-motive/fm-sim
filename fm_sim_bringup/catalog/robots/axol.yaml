# Catalog entry (fm_sim.robots): the bimanual Almond Bot Axol on its Ox cart, in
# fm-robot's axol names. As on the OpenArm, each arm's forward position controller
# commands its seven joints and then the finger, so there is no gripper controller:
# the finger moves only while the forward controller is active. Its robot profile is
# fm-skills' axol (axol_skills_config config/robot_profiles/axol.yaml), so fm-skills'
# controllers run on it beside idle and teleop.
name: axol
description: Almond Bot Axol on the Ox cart, two 7-DOF arms with grippers (fm-robot axol names)
available: true
description_file:
  package: fm_control
  path: urdf/axol.sim.urdf.xacro
description_args: {}
# fm_sim_models compiles the MJCF from fm_description's axol_ox_cart.urdf. Its origin
# is the description's root (world), so it mounts at the default [0, 0, 0].
mjcf: axol
# The Ox cart's lift: no ros2_control system claims it, so it has no state and
# robot_state_publisher would never publish cart -> root, splitting /tf in two. It
# is fixed at 0 (fully raised) in the description every backend reads, as the
# MJCF fixes it (fm_sim_models.axol) and fm-axol does on the real robot.
fixed_joints: [lift]
# The vendored URDF names its meshes relative to its own file; the generators write
# the expanded description elsewhere, so they resolve them here.
mesh_roots:
  - {prefix: meshes/, package: fm_description, path: axol_description/meshes}
controllers_file:
  package: fm_sim_bringup
  path: config/axol/axol.controllers.yaml
# Camera frames and nominal ZED intrinsics, for the backends that render cameras.
cameras_file:
  package: fm_sim_bringup
  path: config/axol/cameras.yaml
controller_roles:
  broadcasters: [joint_state_broadcaster]
  arm_trajectory: [axol_left_jtc, axol_right_jtc]
  arm_forward_position:
    [axol_left_forward_position_controller, axol_right_forward_position_controller]
robot_profile: axol
supported_backends: [mujoco, gazebo, isaac]
# Run tunables (fm_sim_bringup.params).
params:
  update_rate:
    label: Control rate
    description: The controller_manager's update rate.
    type: int
    default: 100
    min: 25
    max: 500
    step: 25
    unit: Hz
    advanced: true
    backends:
    - mujoco
    target:
      kind: ros_param
      node: /controller_manager
      param: update_rate
  head_camera_rate:
    label: Head camera rate
    description: How often the camera publishes, at most. The engine renders 10 Hz (backend camera_render_rate) and the bridge carries 10 Hz, so the cameras file's 15 runs at 10.
    type: float
    default: 10.0
    min: 1.0
    max: 10.0
    step: 1.0
    unit: Hz
    backends:
    - mujoco
    target:
      kind: ros_param
      node: /sim_camera_head
      param: rate_hz
  head_jpeg_quality:
    label: Head JPEG quality
    type: int
    default: 90
    min: 10
    max: 100
    step: 5
    advanced: true
    backends:
    - mujoco
    target:
      kind: ros_param
      node: /sim_camera_head
      param: jpeg_quality
  wrist_left_camera_rate:
    label: Left wrist camera rate
    description: How often the camera publishes, at most. The engine renders 10 Hz (backend camera_render_rate) and the bridge carries 10 Hz, so the cameras file's 15 runs at 10.
    type: float
    default: 10.0
    min: 1.0
    max: 10.0
    step: 1.0
    unit: Hz
    backends:
    - mujoco
    target:
      kind: ros_param
      node: /sim_camera_wrist_left
      param: rate_hz
  wrist_left_jpeg_quality:
    label: Left wrist JPEG quality
    type: int
    default: 90
    min: 10
    max: 100
    step: 5
    advanced: true
    backends:
    - mujoco
    target:
      kind: ros_param
      node: /sim_camera_wrist_left
      param: jpeg_quality
  wrist_right_camera_rate:
    label: Right wrist camera rate
    description: How often the camera publishes, at most. The engine renders 10 Hz (backend camera_render_rate) and the bridge carries 10 Hz, so the cameras file's 15 runs at 10.
    type: float
    default: 10.0
    min: 1.0
    max: 10.0
    step: 1.0
    unit: Hz
    backends:
    - mujoco
    target:
      kind: ros_param
      node: /sim_camera_wrist_right
      param: rate_hz
  wrist_right_jpeg_quality:
    label: Right wrist JPEG quality
    type: int
    default: 90
    min: 10
    max: 100
    step: 5
    advanced: true
    backends:
    - mujoco
    target:
      kind: ros_param
      node: /sim_camera_wrist_right
      param: jpeg_quality
  head_depth_sensor:
    label: Head depth sensor
    description: Publish /cam_head/depth_sensor/compressed, the head camera's depth as a RealSense D435-like sensor reports it (noise growing with depth squared, dropout at edges and out of range), drawn from the run's seed. On by default, as the real ZED X Mini publishes depth.
    type: bool
    default: true
    advanced: true
    backends:
    - mujoco
    target:
      kind: ros_param
      node: /sim_camera_head
      param: depth_sensor
