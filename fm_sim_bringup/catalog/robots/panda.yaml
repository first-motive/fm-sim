# Catalog entry (fm_sim.robots): the Franka Panda arm + hand in franka_description's
# names, which call the Panda `fer` (fer_joint1..7, fer_finger_joint1..2). No robot
# profile describes it yet, so a controller with a launch of its own is refused on
# it; idle and teleop run.
name: panda
description: Franka Panda, 7-DOF arm with the Franka hand (franka_description fer names)
available: true
description_file:
  package: fm_control
  path: urdf/panda.sim.urdf.xacro
description_args: {}
# fm_sim_models renames mujoco_menagerie's Panda to the fer_* joints.
mjcf: panda
controllers_file:
  package: fm_sim_bringup
  path: config/panda/panda.controllers.yaml
controller_roles:
  broadcasters: [joint_state_broadcaster]
  arm_trajectory: [panda_arm_controller]
  arm_forward_position: [panda_arm_forward_position_controller]
  gripper: [panda_gripper_controller]
robot_profile: null
supported_backends: [mujoco, gazebo, isaac]
# Run tunables (fm_sim_bringup.params). The hand ones patch the MJCF fm_sim_models
# writes (panda.FINGER_KP, panda.FINGER_FORCE_N).
params:
  update_rate:
    label: Control rate
    description: The controller_manager's update rate.
    type: int
    default: 100
    min: 25
    max: 500
    step: 25
    unit: Hz
    advanced: true
    backends:
    - mujoco
    target:
      kind: ros_param
      node: /controller_manager
      param: update_rate
  arm_end_velocity:
    label: Arm ends moving
    description: Let a trajectory end with the joints still moving (JTC allow_nonzero_velocity_at_trajectory_end).
    type: bool
    default: true
    advanced: true
    target:
      kind: ros_param
      node: /panda_arm_controller
      param: allow_nonzero_velocity_at_trajectory_end
  gripper_end_velocity:
    label: Gripper ends moving
    description: Let a trajectory end with the joints still moving (JTC allow_nonzero_velocity_at_trajectory_end).
    type: bool
    default: true
    advanced: true
    target:
      kind: ros_param
      node: /panda_gripper_controller
      param: allow_nonzero_velocity_at_trajectory_end
  hand_stiffness:
    label: Hand stiffness
    description: The finger servo gain (FINGER_KP in fm_sim_models).
    type: float
    default: 100.0
    min: 10.0
    max: 1000.0
    step: 10.0
    unit: N/m
    advanced: true
    backends:
    - mujoco
    target:
      kind: description
      mjcf:
        element: position
        name: hand
        attribute: kp
  hand_force_limit:
    label: Hand force limit
    description: The finger force range, low then high (FINGER_FORCE_N in fm_sim_models).
    type: array
    items: float
    length: 2
    ordered: true
    default:
    - -100.0
    - 100.0
    min: -200.0
    max: 200.0
    step: 5.0
    unit: N
    advanced: true
    backends:
    - mujoco
    target:
      kind: description
      mjcf:
        element: position
        name: hand
        attribute: forcerange
