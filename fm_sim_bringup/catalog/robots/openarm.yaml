# Catalog entry (fm_sim.robots): the bimanual OpenArm v2 in fm-robot's canonical
# openarm_* names. Controller names follow the fm_openarm_v2 robot profile.
name: openarm
description: OpenArm v2, bimanual with pinch grippers (fm-robot openarm_* names)
available: true
description_file:
  package: fm_control
  path: urdf/openarm.sim.urdf.xacro
description_args:
  robot_preset: default_bimanual
  # The profile's TCP is the pinch gripper's grasp frame.
  emit_grasp_frame: 'true'
mjcf: openarm
# The vendored MJCF has the arm bases at its origin; the description mounts them
# 0.698 m up on openarm_body_link0 (as openarm_mujoco's pedestal.xml does).
mjcf_mount_xyz: [0.0, 0.0, 0.698]
controllers_file:
  package: fm_sim_bringup
  path: config/openarm/default_bimanual.controllers.yaml
controller_roles:
  broadcasters: [joint_state_broadcaster]
  arm_trajectory: [openarm_left_arm_controller, openarm_right_arm_controller]
  arm_forward_position:
    [openarm_left_forward_position_controller, openarm_right_forward_position_controller]
  gripper: [openarm_left_gripper_controller, openarm_right_gripper_controller]
robot_profile: fm_openarm_v2
supported_backends: [mujoco, gazebo, isaac]
# Nodes a controller can activate by role; each starts once the active spawner has
# exited cleanly. servo is fm-robot's sim-only MoveIt Servo on /servo_node, which
# streams JointJog commands to the right arm's trajectory controller.
launch_roles:
  servo:
    requires: [arm_trajectory]
    launch:
      package: fm_control
      path: launch/openarm_sim_servo.launch.py
    launch_args:
      sim_only: 'true'
      command_type: joint_jog
