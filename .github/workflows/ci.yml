name: CI

on:
  # Push runs only on integration; feature branches are covered by pull_request
  # and are not built twice.
  push:
    branches: ["main"]
    paths-ignore: ["docs/**", "LICENSE", ".gitignore", "plans/**"]
  pull_request:
    paths-ignore: ["docs/**", "LICENSE", ".gitignore", "plans/**"]

# Standalone build (hybrid CI): fm-sim builds its own packages on Jazzy, the only
# distro the sim stack targets. Its MJCF model externals (SO-ARM, OpenArm, Unitree)
# are file-vendored, not colcon packages, so they are COLCON_IGNORE'd. It builds the
# externals with no Jazzy apt release: topic_based_ros2_control, and fm-robot (the
# robot descriptions) with openarm_description and unitree_ros2. The full
# integration build lives in fm-ros2.
jobs:
  # Rendered files (AGENTS.md, .fm/) come from the render plane and carry a hash of
  # their own body. This fails the PR when one was edited in place.
  drift:
    uses: first-motive/.github/.github/workflows/drift-check.yml@main

  # No server-side branch protection exists on this repo, so a push straight to
  # main is possible. The rendered pre-push hook refuses one locally; this
  # notices the ones it cannot refuse and opens an issue naming the commit.
  # The called job guards on push-to-default itself, so it skips on a PR.
  # The permissions block is scoped to this job alone: opening the issue needs
  # issues:write, which no other job here is granted.
  tripwire:
    uses: first-motive/.github/.github/workflows/direct-push-tripwire.yml@main
    permissions:
      contents: read
      issues: write
      pull-requests: read

  # The piped-curl front door check lives in first-motive/.github.
  selftest:
    uses: first-motive/.github/.github/workflows/bootstrap-selftest.yml@main

  # The colcon block lives in first-motive/.github. The fm_sim prefix tests only
  # this repo's packages: fm-robot's own fm_* tests are its CI's to keep green. The
  # apt packages are the ones unitree_ros2's messages build with, as in fm-robot.
  build-test:
    uses: first-motive/.github/.github/workflows/ros2-build-test.yml@main
    with:
      distro: jazzy
      # Docker Hub's ros image: this public repo runs GitHub-hosted, where the
      # shared egress addresses exhaust ECR Public's anonymous data cap.
      image: ros:jazzy
      checkout-path: src/fm-sim
      repos-file: fm-sim.repos
      build-externals: topic_based_ros2_control fm-robot openarm_description unitree_ros2
      apt-packages: >-
        ros-jazzy-rosidl-generator-dds-idl ros-jazzy-cyclonedds ros-jazzy-rmw-cyclonedds-cpp
      package-prefix: fm_sim

  # Each architecture builds natively on a runner of its own kind, following
  # Docker's "distribute build across multiple runners" pattern: emulating arm64
  # under QEMU took most of half an hour. Each leg smokes the image it built, since
  # the production sim host is x86_64 and a Mac runs arm64. On main it then pushes
  # that image by digest, and image-merge tags the digests as one multi-arch image.
  image:
    name: build + smoke + push image (${{ matrix.arch }}, FROM fm-docker jazzy base)
    strategy:
      # One architecture failing says nothing about the other; let both report.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The shared smoke asserts, mounted into the image below. No persisted
      # credentials: the mount would hand this job's package-write token to code
      # running in the image.
      - uses: actions/checkout@v7
        with:
          repository: first-motive/.github
          path: .fm-ci
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Log in to GHCR — to pull the fm-docker base FROM and to push this layer
      # (the Dockerfile is FROM ghcr.io/first-motive/fm-docker:jazzy).
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Load the image into the local daemon so the smoke runs against what main
      # then pushes; the push step rebuilds from this builder's cache. Each
      # architecture keeps its own cache scope, or the two legs would overwrite
      # each other's cache.
      - name: Build the sim image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: fm-sim:smoke
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # Each backend runs inside the image; the entrypoint sources ROS + the baked
      # overlay. Software GL (LIBGL_ALWAYS_SOFTWARE=1) keeps gazebo + mujoco off a
      # real GPU. isaac is not smoked — Linux + NVIDIA only, never in this base.
      #
      # Every step below either asserts an observable result or runs a bounded
      # workload that must exit 0. None of them accept "still alive when the timer
      # fired", which passes for a launch whose only node died on import.
      # Same assertions the native smoke runs, against the baked image instead of a
      # freshly built workspace. The script is mounted rather than copied, so the
      # two jobs cannot drift apart.
      - name: Smoke mock (sim loop publishes)
        run: |
          docker run --rm -e LIBGL_ALWAYS_SOFTWARE=1 \
            -v "${{ github.workspace }}/.fm-ci:/fm-ci:ro" \
            -e LAUNCH='ros2 launch fm_sim_core sim.launch.py' \
            -e EXPECT_NODES=/sim_loop \
            -e EXPECT_TOPICS=/joint_states \
            fm-sim:smoke \
            /ros_entrypoint.sh bash -lc 'bash /fm-ci/scripts/ros2-smoke-assert.sh'

      - name: Smoke mujoco (xvfb headless)
        run: |
          # One-shot: boot the binding under a virtual display, step one frame.
          # Expect a clean exit 0. Outer cmd single-quoted; the python string's
          # inner quotes are escaped \" so they survive bash's double quotes.
          set +e
          docker run --rm -e LIBGL_ALWAYS_SOFTWARE=1 fm-sim:smoke \
            /ros_entrypoint.sh bash -lc 'timeout 60 xvfb-run -a python3 -c "import mujoco; m = mujoco.MjModel.from_xml_string(\"<mujoco><worldbody/></mujoco>\"); mujoco.mj_step(m, mujoco.MjData(m)); print(\"mujoco stepped headless\")"'
          code=$?; echo "exit=$code"
          [ "$code" -eq 0 ]

      - name: Smoke gazebo (gz -s server-only)
        run: |
          # Server-only headless: no GUI, bounded iterations on the empty world.
          # Jazzy pairs with Gazebo Harmonic, so the CLI is `gz sim`. --iterations
          # makes this a finite workload, so the engine stepping 200 times and
          # exiting 0 is the assertion. A hang is now a failure rather
          # than a pass: 124 means the engine never finished the world it was given.
          set -eo pipefail
          docker run --rm -e LIBGL_ALWAYS_SOFTWARE=1 fm-sim:smoke \
            /ros_entrypoint.sh bash -lc 'timeout 90 gz sim -s -r --iterations 200 empty.sdf'

      # Publish to GHCR only on main; a pull request builds and smokes to validate
      # without pushing. The image goes up untagged, by digest alone, so neither
      # leg can publish a :jazzy that lacks the other architecture.
      # tradeoff: this rebuilds rather than pushing the loaded image, trusting the
      # builder's cache to reproduce the smoked layers; if a pushed digest ever
      # differs from the smoked one, push by digest first and smoke that pull.
      - name: Publish the sim image by digest
        id: publish
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/first-motive/fm-sim,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Export the digest
        if: github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          # The empty file's name is the payload: image-merge collects one per leg
          # into a single directory and reads the digests back from the names.
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # The smoke asserts the loop is running, not that a timer fired on a live process.
  #
  # This job used to accept exit 124 from `run.sh --backend mock`, and the mock
  # backend falls through to mujoco, whose sim_loop imports the mujoco wheel lazily.
  # The wheel is not in the ros base image, so the node died on that import every
  # run, the launch stayed up around the corpse, the timer fired, and the job went
  # green — the exact failure the smoke exists to catch. pip-packages now installs
  # the wheel, and /joint_states is asserted, so a dead sim_loop is red.
  smoke:
    name: smoke run.sh (native headless)
    uses: first-motive/.github/.github/workflows/ros2-smoke.yml@main
    with:
      distro: jazzy
      image: ros:jazzy  # as build-test
      repos-file: fm-sim.repos
      build-externals: topic_based_ros2_control fm-robot openarm_description unitree_ros2
      apt-packages: >-
        ros-jazzy-rosidl-generator-dds-idl ros-jazzy-cyclonedds ros-jazzy-rmw-cyclonedds-cpp
      # Word-split by the shared workflow into `uv pip install --system ...`. Noble
      # marks the system Python externally managed (PEP 668), so the override is
      # needed here as it is in the Dockerfile.
      pip-packages: --break-system-packages -r requirements-sim.txt
      launch: ./run.sh --native --backend mock
      expect-nodes: /sim_loop
      expect-topics: /joint_states

  # Tags the per-architecture digests as one multi-arch :jazzy, once both legs
  # have built, smoked and pushed.
  image-merge:
    name: publish multi-arch image
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the multi-arch image
        working-directory: ${{ runner.temp }}/digests
        run: |
          # Each file here is named after the digest one leg pushed.
          refs=()
          for digest in *; do refs+=("ghcr.io/first-motive/fm-sim@sha256:$digest"); done
          docker buildx imagetools create -t ghcr.io/first-motive/fm-sim:jazzy "${refs[@]}"

      - name: Inspect the multi-arch image
        run: docker buildx imagetools inspect ghcr.io/first-motive/fm-sim:jazzy

  # The AWS sim host stack (infra/aws/sim): cfn-lint, the controller and idle
  # tests against fakes, and shellcheck. No AWS credentials; nothing is deployed.
  infra-aws-sim:
    name: aws sim host stack (static)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Validate
        run: infra/aws/sim/deploy.sh validate

  # The sim agent and the `fm sim` CLI (agent/, a uv project outside colcon):
  # the suite runs against a fake runner, a stand-in docker and in-process
  # Zenoh peers on 127.0.0.1, so no router, Docker daemon or image is needed.
  agent:
    name: sim agent and fm sim cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Test
        run: uv run --locked --extra dev pytest
      - name: Lint
        run: |
          uv run --locked --extra dev ruff check src tests
          uv run --locked --extra dev ruff format --check src tests
