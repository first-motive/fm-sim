name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "LICENSE", ".gitignore", "plans/**"]
  pull_request:
    paths-ignore: ["docs/**", "LICENSE", ".gitignore", "plans/**"]

# Standalone build (hybrid CI): fm-sim builds its own packages. Its externals are
# MJCF model sources (SO-ARM, OpenArm, Unitree) — file-vendored, not colcon
# packages — so they are COLCON_IGNORE'd. The full integration build lives in
# fm-ros2.
jobs:
  # Rendered files (AGENTS.md, .fm/) come from the render plane and carry a hash of
  # their own body. This fails the PR when one was edited in place.
  drift:
    uses: first-motive/.github/.github/workflows/drift-check.yml@main

  # No server-side branch protection exists on this repo, so a push straight to
  # main is possible. The rendered pre-push hook refuses one locally; this
  # notices the ones it cannot refuse and opens an issue naming the commit.
  # The called job guards on push-to-default itself, so it skips on a PR.
  # The permissions block is scoped to this job alone: opening the issue needs
  # issues:write, which no other job here is granted.
  tripwire:
    uses: first-motive/.github/.github/workflows/direct-push-tripwire.yml@main
    permissions:
      contents: read
      issues: write
      pull-requests: read

  # The piped-curl front door check lives in first-motive/.github.
  selftest:
    uses: first-motive/.github/.github/workflows/bootstrap-selftest.yml@main

  # The colcon block lives in first-motive/.github. Every external here is an MJCF
  # model source, not a colcon package, so none are built.
  build-test:
    uses: first-motive/.github/.github/workflows/ros2-build-test.yml@main
    with:
      checkout-path: src/fm-sim
      repos-file: fm-sim.repos
      package-prefix: ""

  image:
    name: build + publish image (FROM fm-robot layer)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # fm-render:begin qemu-binfmt sha256:83c33276dedb113f2237a8de56620ea914da38d4afd9f70c28c44267553b6375 — rendered by the First Motive render plane — edit the upstream source, not this file
      # Pin a recent qemu: the default ships an older build whose arm64 user-mode
      # emulation segfaults on heavy glibc postinst — libc-bin's ldconfig dies
      # with SIGSEGV and the layer fails with exit 100. fm-teleop hit it first;
      # fm-robot hit it the moment an apt layer grew. Newer qemu emulates that
      # path cleanly. One pin for every repo that emulates arm64 in CI.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3
      # fm-render:end qemu-binfmt

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Log in to GHCR — to pull the private fm-robot base FROM and to push this
      # layer (the Dockerfile is FROM ghcr.io/first-motive/fm-robot:humble).
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build multi-arch (arm64 + amd64). Publish to GHCR only on main — branch and
      # PR runs build to validate without pushing.
      - name: Build + publish the sim image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/first-motive/fm-sim:humble
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The smoke asserts the loop is running, not that a timer fired on a live process.
  #
  # This job used to accept exit 124 from `run.sh --backend mock`, and the mock
  # backend falls through to mujoco, whose sim_loop imports the mujoco wheel lazily.
  # The wheel is not in ros:humble, so the node died on that import every run, the
  # launch stayed up around the corpse, the timer fired, and the job went green —
  # the exact failure the smoke exists to catch. pip-packages now installs the wheel,
  # and /joint_states is asserted, so a dead sim_loop is red.
  smoke:
    name: smoke run.sh (native headless)
    uses: first-motive/.github/.github/workflows/ros2-smoke.yml@main
    with:
      repos-file: fm-sim.repos
      pip-packages: mujoco
      launch: ./run.sh --native --backend mock
      expect-nodes: /sim_loop
      expect-topics: /joint_states

  smoke-container:
    name: smoke container (headless backends)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # The shared smoke asserts, mounted into the image below.
      - uses: actions/checkout@v7
        with:
          repository: first-motive/.github
          path: .fm-ci

      # Log in to GHCR to pull the private fm-robot base the Dockerfile is FROM.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the baked amd64 image into the local daemon (single-arch, loaded; the
      # multi-arch publish lives in the `image` job). It carries the colcon build,
      # so `docker run` reaches a running sim with no in-container build. This is the
      # amd64 lane proving the launch logic regardless of the arm64 smoke.sh result.
      - name: Build the baked image
        run: docker build -t fm-sim:smoke .

      # Each backend runs inside the image; the entrypoint sources ROS + the baked
      # overlay. Software GL (LIBGL_ALWAYS_SOFTWARE=1) keeps gazebo + mujoco off a
      # real GPU. isaac is not smoked — Linux + NVIDIA only, never in this base.
      #
      # Every step below either asserts an observable result or runs a bounded
      # workload that must exit 0. None of them accept "still alive when the timer
      # fired", which passes for a launch whose only node died on import.
      # Same assertions the native smoke runs, against the baked image instead of a
      # freshly built workspace. The script is mounted rather than copied, so the
      # two jobs cannot drift apart.
      - name: Smoke mock (sim loop publishes)
        run: |
          docker run --rm -e LIBGL_ALWAYS_SOFTWARE=1 \
            -v "${{ github.workspace }}/.fm-ci:/fm-ci:ro" \
            -e LAUNCH='ros2 launch fm_sim_core sim.launch.py' \
            -e EXPECT_NODES=/sim_loop \
            -e EXPECT_TOPICS=/joint_states \
            fm-sim:smoke \
            /ros_entrypoint.sh bash -lc 'bash /fm-ci/scripts/ros2-smoke-assert.sh'

      - name: Smoke mujoco (xvfb headless)
        run: |
          # One-shot: boot the binding under a virtual display, step one frame.
          # Expect a clean exit 0. Outer cmd single-quoted; the python string's
          # inner quotes are escaped \" so they survive bash's double quotes.
          set +e
          docker run --rm -e LIBGL_ALWAYS_SOFTWARE=1 fm-sim:smoke \
            /ros_entrypoint.sh bash -lc 'timeout 60 xvfb-run -a python3 -c "import mujoco; m = mujoco.MjModel.from_xml_string(\"<mujoco><worldbody/></mujoco>\"); mujoco.mj_step(m, mujoco.MjData(m)); print(\"mujoco stepped headless\")"'
          code=$?; echo "exit=$code"
          [ "$code" -eq 0 ]

      - name: Smoke gazebo (gz -s server-only)
        run: |
          # Server-only headless: no GUI, bounded iterations on the empty world.
          # `gz` (Garden+) or `ign` (Fortress) depending on the image's gz stack.
          # --iterations makes this a finite workload, so the engine stepping 200
          # times and exiting 0 is the assertion. A hang is now a failure rather
          # than a pass: 124 means the engine never finished the world it was given.
          set -eo pipefail
          docker run --rm -e LIBGL_ALWAYS_SOFTWARE=1 fm-sim:smoke \
            /ros_entrypoint.sh bash -lc 'timeout 90 sh -c "command -v gz >/dev/null 2>&1 && gz sim -s -r --iterations 200 empty.sdf || ign gazebo -s -r --iterations 200 empty.sdf"'
