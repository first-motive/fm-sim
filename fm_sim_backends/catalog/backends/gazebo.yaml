# Catalog entry (fm_sim.backends): Gazebo Harmonic, with gz_ros2_control hosting the
# controller_manager inside the sim.
name: gazebo
description: Gazebo Harmonic via gz_ros2_control; GPU host, or headless server-only
available: true
launch:
  package: fm_sim_backends
  path: launch/gazebo.launch.py
# Server only: the run is viewed through the app, and a sim host has no display
# for the gz GUI (it aborts on Qt without one).
launch_args:
  gz_args: -s -r -v 3 empty.sdf
description_args:
  sim_backend: gz
  gazebo_controllers_file: '{controllers_file}'
